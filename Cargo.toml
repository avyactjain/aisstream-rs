[package]
name = "aisstream-rs"
version = "0.1.0"
edition = "2024"
description = "Async Rust client for streaming real-time AIS vessel data from aisstream.io"
readme = "README.md"
license = "MIT"
keywords = ["ais", "maritime", "websocket", "streaming", "vessel-tracking"]
categories = ["network-programming", "asynchronous"]
repository = "https://github.com/avyactjain/asistream"
documentation = "https://docs.rs/asistream"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["rt", "sync", "time", "macros"] }
tokio-stream = "0.1.18"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3.32"
url = "2"
anyhow = "1.0.102"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
